[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autoreport"
version = "0.1.0"
description = "AutoReport - automated report and analytics generator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9",
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "plotly>=5.18",
    "Jinja2>=3.1",
    "PyYAML>=6.0",
    "reportlab>=4.0",
    "APScheduler>=3.10,<4",
    "openpyxl>=3.1",
    "requests>=2.31",
    "tzdata>=2024.1",  # timezone database; Windows has none, APScheduler needs it
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]

[project.scripts]
autoreport = "autoreport.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
autoreport = ["templates_builtin/*.yaml", "builders/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::PendingDeprecationWarning:seaborn.*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
